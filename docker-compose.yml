services:
  timeline:
    build: .
    image: vibaura-simple-timeline
    container_name: vibaura-timeline
    restart: unless-stopped
    # init: true => un vrai PID 1 (tini) qui propage SIGTERM et récolte les zombies,
    # pour un arrêt propre (le serveur checkpoint le WAL et ferme SQLite).
    init: true
    # .env optionnel : Compose ne plante pas s'il manque. Le conteneur, lui,
    # refuse de démarrer sans AUTH_PASSWORD / SESSION_SECRET valides (fail-fast dans les logs).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    # Exposé uniquement en local : c'est nginx (sur l'hôte) qui proxy vers ce port.
    # Le port vient du .env (PORT), 8790 par défaut. Retire "127.0.0.1:" pour l'exposer au réseau.
    ports:
      - "127.0.0.1:${PORT:-8790}:${PORT:-8790}"
    volumes:
      - ./data:/app/data
