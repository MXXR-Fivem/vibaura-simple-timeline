# Exemple de bloc nginx pour exposer la timeline en HTTPS.
# À adapter à ta config existante (certificats, server_name...).

server {
    listen 443 ssl;
    http2 on;
    server_name timeline.exemple.com;

    # ssl_certificate     /etc/letsencrypt/live/timeline.exemple.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/timeline.exemple.com/privkey.pem;

    # Taille max des requêtes (descriptions, etc.)
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirection HTTP -> HTTPS (optionnel)
server {
    listen 80;
    server_name timeline.exemple.com;
    return 301 https://$host$request_uri;
}
