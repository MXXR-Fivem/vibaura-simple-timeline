# Exemple de bloc nginx pour exposer la timeline en HTTPS.
# À adapter à ta config existante (certificats, server_name...).
#
# IMPORTANT : l'upstream (127.0.0.1:8790) doit correspondre à PORT dans .env.
# Si tu changes PORT, change-le AUSSI ici, sinon 502 Bad Gateway.

server {
    listen 443 ssl;
    http2 on;
    server_name timeline.exemple.com;

    # ssl_certificate     /etc/letsencrypt/live/timeline.exemple.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/timeline.exemple.com/privkey.pem;

    # Taille max des requêtes : alignée sur la limite JSON du serveur (256kb).
    client_max_body_size 256k;

    # --- En-têtes de sécurité (posés là où le TLS se termine) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    # L'app n'utilise aucune ressource externe : CSP restrictive possible.
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # --- Compression (le bundle JS/CSS est servi via le proxy) ---
    gzip            on;
    gzip_proxied    any;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Endpoint MCP (agents Claude / Codex / Gemini) ---
    # Une réponse d'outil peut arriver en flux SSE (quand le serveur émet des
    # notifications avant son résultat) : sans proxy_buffering off, nginx les
    # retient en tampon et l'agent attend dans le vide.
    location /api/mcp {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirection HTTP -> HTTPS (optionnel)
server {
    listen 80;
    server_name timeline.exemple.com;
    return 301 https://$host$request_uri;
}
